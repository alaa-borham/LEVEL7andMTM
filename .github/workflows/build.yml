name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: python3 -m unittest discover -s tests -v

  windows:
    # the installer (Setup.exe) must be built on Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL7-CAD-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          retention-days: 30

  level7-and-mtm-windows:
    # LEVEL7 and MTM (native MDL editor) packaged for Windows from level7-cad/releases/app (latest release tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash level7-cad/build-windows.sh 0.9.158 dist-level7
      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL7-and-MTM-0.9.158-windows
          path: dist-level7/LEVEL7-and-MTM-0.9.158-win32-x64.zip
          retention-days: 30
